[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frappe-mcp"
description = "Frappe MCP allows building MCP compatibility into Frappe apps"
authors = [
  { name = "Alan Tom", email = "me@18alan.space" },
  { name = "Frappe Techonologies Pvt Ltd", email = "developers@frappe.io" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Werkzeug==3.1.3",
  # Relaxed from `~=2.11.7` (LabGrid fork).
  # pydantic 2.11.x resolves pydantic-core==2.33.2, which publishes no
  # CPython 3.14 wheel; pip then builds it from Rust and its pyo3 0.24.1
  # refuses any interpreter newer than 3.13, so installation fails outright
  # on 3.14 (e.g. Frappe Cloud images). pydantic-core gained cp314 wheels
  # at 2.46.1, first required by pydantic 2.13. The library itself needs no
  # 2.11-specific API: tools/list, schema inference and tools/call all
  # verified against pydantic 2.13.4 on CPython 3.14.
  "pydantic>=2.13",
  "jsonschema (>=4.24.0,<5.0.0)",
  "Click>=8.1.8,<9",
]
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/frappe/frappe-mcp"
Documentation = "https://github.com/frappe/frappe-mcp"
Source = "https://github.com/frappe/frappe-mcp"

[project.scripts]
frappe-mcp = "frappe_mcp.cli:run"

[dependency-groups]
dev = ["pytest>=8.4.1", "ruff>=0.12.0"]

[tool.hatch.version]
path = "frappe_mcp/__init__.py"

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88 # Same as Black.
indent-width = 4

target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "RUF", # ruff-specific rules
  "FA",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"frappe_mcp/server/types.py" = ["N815", "UP007"]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
